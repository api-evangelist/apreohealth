name: Apreohealth
description: 'Apreo Health is a clinical-stage medical device company based in Menlo Park, California,
  developing a novel, tissue-sparing bronchoscopic treatment for severe emphysema. Its investigational
  Apreo BREATHE Airway Scaffold uses a self-expanding nitinol scaffold to tent open targeted airways,
  releasing trapped air and reducing lung hyperinflation without removing healthy tissue. The device
  received FDA Breakthrough Device Designation in 2024 and is being evaluated in the BREATHE clinical
  trial program. Backed by Norwest Venture Partners, F-Prime Capital, and OSF Ventures, Apreo Health
  is a physical medical device company with no public developer API, SDK, or software platform; this
  profile tracks the company as a portfolio lead in the API Evangelist network.'
